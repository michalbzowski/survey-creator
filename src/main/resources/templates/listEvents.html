{#include layouts/main}
{#title}
Wydarzenia
{/title}
{#subtitle}
<a id="create-new" href="/web/events/new">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         class="lucide lucide-calendar-plus2-icon lucide-calendar-plus-2">
        <path d="M8 2v4"/>
        <path d="M16 2v4"/>
        <rect width="18" height="18" x="3" y="4" rx="2"/>
        <path d="M3 10h18"/>
        <path d="M10 16h4"/>
        <path d="M12 14v4"/>
    </svg>
</a>
{/subtitle}
{#body}
{#if events}
<div class="grid">
    {#for event in events}
    <article class="article-flex">
        <header data-events-name="{event.name}"><strong>{event.name}</strong></header>
        {event.location}
        <p>{event.formatedLocalDateTime}</p>
        <footer class="article-footer">
            <div role="group">
                <a class="events-details" href="/web/events/{event.id}/details">
                    Szczegóły
                </a>
                <a class="delete-event" data-id="{event.id}">
                    Usuń
                </a>
            </div>
        </footer>
    </article>
    {/for}
</div>
{#else}
<p>
    Nie stworzyłeś jeszcze żadnego wydarzenia.
    <a href="/web/events/new">
        Zrób to teraz!
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="lucide lucide-calendar-plus2-icon lucide-calendar-plus-2">
            <path d="M8 2v4"/>
            <path d="M16 2v4"/>
            <rect width="18" height="18" x="3" y="4" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M10 16h4"/>
            <path d="M12 14v4"/>
        </svg>
    </a>
</p>
{/if}

<script src="/js/script_list_event_umbrella.js"></script>


{/body}
{/include}
