<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <title>Potwierdzenie dodania adresu</title>
    <style>
        body {
          background-color: #f9f9fb;
          color: #333;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          padding: 2rem;
          max-width: 600px;
          margin: auto;
          text-align: center;
        }
        strong.brand {
          font-size: 28px;
          color: #2a2a72;
          display: block;
          margin-bottom: 1.5rem;
          font-weight: 700;
        }
        p {
          font-size: 16px;
          line-height: 1.6;
          margin-bottom: 1.2rem;
        }
        footer {
          margin-top: 3rem;
          font-size: 14px;
          color: #777;
        }
    </style>
</head>
<body>
<strong class="brand"><a target="_blank" href="https://potwierdzobecność.pl">PotwierdzObecność.Pl</a></strong>
<p>Dziękujemy, <strong>{firstName} {lastName}</strong>!</p>
<p>Twój adres e-mail został potwierdzony.</p>
<p>Wkrótce możesz spodziewać się wiadomości dotyczących obecności na wydarzeniach.</p>
<p>Życzymy wysokiej frekwencji!</p>
<footer>
    Jeśli masz pytania, jesteśmy do dyspozycji <a target="_blank" href="kontakt@potwierdzobecnosc.pl">kontakt@potwierdzobecnosc.pl</a>
</footer>
</body>
</html>
