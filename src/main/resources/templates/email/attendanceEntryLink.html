<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Potwierdzenie obecności</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f9f9f9;
          margin: 0; padding: 0;
        }
        .container {
          max-width: 600px;
          margin: 30px auto;
          background-color: #ffffff;
          padding: 20px;
          border: 1px solid #ddd;
          text-align: center;
          color: #333333;
        }
        a {
          color: #0078d7;
          text-decoration: none;
        }
        a:hover {
          text-decoration: underline;
        }
        h1 {
          margin-bottom: 10px;
        }
        h2 {
          color: #555555;
          margin-bottom: 20px;
        }
        .button {
          display: inline-block;
          background-color: #0078d7;
          color: white;
          padding: 12px 25px;
          border-radius: 5px;
          font-weight: bold;
          margin-bottom: 30px;
          text-decoration: none;
        }
        .footer {
          font-size: 0.9em;
          color: #777777;
          margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1><a href="{appHost}" target="_blank" rel="noopener">PotwierdzObecnosc.pl</a></h1>

    <h2>Prosimy o potwierdzenie obecności lub zgłoszenie nieobecności na wydarzeniu.</h2>
    <p>{eventTitle}</p>
    <a href="{attendanceEntryLink}" class="button" target="_blank" rel="noopener">Wypełnij ankietę</a>
    <p>Ta wiadomość przeznaczona jest dla {personEmail}</p>
    <p class="footer">Dziękuję za poświęcony czas i zaangażowanie!</p>
</div>
</body>
</html>
