{#include layouts/main}
{#title}Nowy zespół{/title}
{#body}
<form id="team-form">
    <article hidden="true">
        <label for="name">Nazwa zespołu: </label>
        <input type="text" id="name" name="name" value="{name ?: ''}" />
    </article>
    <div id="events-container">
        {#each team.events}
        <article class="event-entry">
            <label>Wybierz wydarzenie:</label>
            <select name="events[{it_index}]" onchange="checkDuplicateEvents(this)" required>
                <option value="">-- wybierz --</option>
                {#for event in availableEvents}
                <option value="{event.id}">{event.nameWithFormatedLocalDateTime}</option>
                {/for}
            </select>
            <p>
                <a href="#" onclick="removeEvent(this)">
                    <i class="si-minus-circle"></i>
                    Usuń wydarzenie z tego zespolu
                </a>
            </p>
        </article>
        {/each}
    </div>

    <button type="submit">Stwórz zespół na wybrane wydarzenia</button>
    <a href="#" onclick="createEvent()">
        <i class="si-plus-circle"></i>
        Dodaj kolejne wydarzenie dla tego zespołu
    </a>
</form>
<script>
    const availableEventsJson = {availableEventsJson.raw()};
    const selectEventId = "{eventId}"
</script>

<script src="/js/script_create_team_umbrella.js" defer></script>

{/body}
{/include}
