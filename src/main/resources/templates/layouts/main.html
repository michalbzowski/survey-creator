<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="/manifest/manifest.json">
    <meta name="theme-color" content="#01aaff">
    <meta charset="UTF-8">
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="light dark" name="color-scheme">
    <title>{#insert title}{/}</title>
    <link href="/css/pico.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/umbrellajs.js"></script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <!--    IKONKI: https://lucide.dev/icons/pencil -->
</head>
<body>
<header class="container">
    <nav class="nav">
        <div class="nav-left">
            <button id="nav-toggle" class="btn btn-link hide-desktop" aria-label="Toggle navigation menu">
                &#9776;
            </button>
            <a href="/" class="nav-brand" aria-label="Potwierdź obecność">
                <!-- Ikona SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                     stroke="#01aaff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-contact-round-icon lucide-contact-round" role="img" aria-hidden="true"
                     focusable="false">
                    <path d="M16 2v2"/>
                    <path d="M17.915 22a6 6 0 0 0-12 0"/>
                    <path d="M8 2v2"/>
                    <circle cx="12" cy="12" r="4"/>
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                </svg>
                Potwierdź obecność
            </a>
        </div>
        <ul id="nav-menu" class="nav-menu hide-mobile">
            <li><a href="/web/events" class="btn btn-link secondary">Wydarzenia</a></li>
            <li><a href="/web/persons" class="btn btn-link secondary">Osoby</a></li>
            <li><a href="/web/groups" class="btn btn-link secondary">Grupy</a></li>
            <li><a href="/web/tags" class="btn btn-link secondary">Tagi</a></li>
            <li class="dropdown">
                <details>
                    <summary class="btn btn-link secondary" tabindex="0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             class="lucide lucide-circle-user-round-icon lucide-circle-user-round">
                            <path d="M18 20a6 6 0 0 0-12 0"/>
                            <circle cx="12" cy="10" r="4"/>
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </summary>
                    <ul x-data="userHandler()" x-init="loadUser()">
                        <li id="registered-user" x-text="username"></li>
                        <li id="registered-uuid" x-text="uuid" x-show="uuid !== ''" hidden="hidden"></li>
                        <li><a href="/web/configurations" class="btn btn-link secondary">Ustawienia</a></li>
                        <li><a href="/sec/logout" class="btn btn-link secondary">Wyloguj</a></li>
                    </ul>
                </details>
            </li>
        </ul>
    </nav>
</header>

<div class="loader-overlay" id="loader" style="display: none;">
    <div class="loader"></div>
</div>
<main class="container">
    <h2>{#insert title}{/}{#insert subtitle}{/}</h2>
    {#insert body /}
</main>
<footer class="container">
    <p>&copy; 2025 Michał Bzowski</p>
</footer>
<script src="/js/app.js"></script>
</body>
</html>
